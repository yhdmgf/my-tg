[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"
repository = "https://github.com/gdlbo/tellers-tl"
homepage = "https://github.com/gdlbo/tellers-tl"

[workspace.dependencies]
bnum = "0.14"
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6"
crc32fast = "1.4"
heck = "0.5"
prettyplease = "0.3"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full"] }
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
