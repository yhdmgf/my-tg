[package]
name = "tellers-xtask"
description = "Repository maintenance tasks for the tellers TL toolchain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
eyre.workspace = true
clap.workspace = true
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# 0.26+ uses let-chains, which are newer than the workspace's Rust 1.85 MSRV.
scraper = "=0.25.0"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tellers-tl-rust = { path = "../tl-codegen", version = "0.2.0" }
tellers-tl-schema = { path = "../tl-model", version = "0.2.0" }
tellers-tl-parser = { path = "../tl-parser", version = "0.2.0" }
toml_edit = "0.25"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread"] }
walkdir = "2"
tracing = { workspace = true, optional = true }

[features]
default = []
tracing = [
    "dep:tracing",
    "tellers-tl-rust/tracing",
    "tellers-tl-schema/tracing",
    "tellers-tl-parser/tracing",
]
dangerous-unredacted-logging = [
    "tracing",
    "tellers-tl-rust/dangerous-unredacted-logging",
    "tellers-tl-schema/dangerous-unredacted-logging",
    "tellers-tl-parser/dangerous-unredacted-logging",
]

[lints]
workspace = true
